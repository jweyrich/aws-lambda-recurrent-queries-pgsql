name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runtime dependencies only: the dev-only Serverless v3 CLI has
      # known advisories that will not be fixed upstream.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # scripts/test.sh starts its own SSL-enabled PostgreSQL in Docker
      # (with a throwaway CA), so the SSL tests run here too.
      - name: Run tests
        run: npm test
