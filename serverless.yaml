#      Resource: { "Fn::Join" : ["", ["arn:aws:s3:::", { "Ref" : "ServerlessDeploymentBucket" } ] ]  }
#    - Effect: "Allow"
#      Action:
#        - "s3:PutObject"
#      Resource:
#        Fn::Join:
#          - ""
#          - - "arn:aws:s3:::"
#            - "Ref" : "ServerlessDeploymentBucket"
#            - "/*"

# Service wide environment variables
  environment:
    DB_HOST: REPLACE_ME
    DB_PORT: 5432

functions:
  recurrent_select_now:
    handler: index.handler
    events:
      - schedule: rate(1 hour)
#      - cloudwatchLog: '/aws/lambda/select_now'
    environment:
      DB_HOST: REPLACE_ME
      DB_NAME: REPLACE_ME
      DB_USER: REPLACE_ME
      DB_PASSWORD: "REPLACE_ME"
      DB_QUERY: "SELECT NOW()"
 

